<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Tools | Dev-CLI</title>
    <meta name="description" content="Browse every developer tool Dev-CLI can install on Windows with a single command — Node.js, Python, Rust, Docker, Git and more.">
    <meta name="theme-color" content="#09090b">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Available Tools | Dev-CLI">
    <meta property="og:description" content="22 curated developer tools, one command away. Search the full Dev-CLI catalog.">
    <meta property="og:url" content="https://dev-cli.netlify.app/tools.html">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2309090b'/%3E%3Ctext x='14' y='45' font-family='monospace' font-size='38' fill='%2306b6d4'%3E%26gt;_%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-blob blob-1"></div>
    <div class="background-blob blob-2"></div>

    <a href="#main" class="skip-link">Skip to content</a>

    <nav>
        <a href="index.html" class="logo">dev-cli<span>.</span></a>
        <div class="nav-links" id="nav-links">
            <a href="index.html#features">Features</a>
            <a href="index.html#how-it-works">How It Works</a>
            <a href="index.html#demo">Demo</a>
            <a href="tools.html" class="active" aria-current="page">Tools</a>
            <a href="docs.html">Docs</a>
            <a href="https://github.com/drjoeycadieux/dev-cli" class="github-btn">GitHub</a>
        </div>
        <button type="button" class="mobile-menu-btn" aria-label="Toggle menu" aria-expanded="false" aria-controls="nav-links">
            <span class="hamburger" aria-hidden="true"></span>
        </button>
    </nav>

    <header class="page-header" id="main">
        <h1>Curated <span class="gradient-text">Tools</span></h1>
        <p>A list of battle-tested tools you can install instantly.</p>
    </header>

    <section class="tools-section" aria-labelledby="tools-heading">
        <h2 id="tools-heading" class="visually-hidden">Search developer tools</h2>

        <div class="tools-toolbar">
            <div class="search-field">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <label for="tool-search" class="visually-hidden">Search tools</label>
                <input id="tool-search" type="search" placeholder="Search tools, IDs or categories…"
                       autocomplete="off" spellcheck="false" aria-describedby="tool-count">
                <kbd class="search-kbd" aria-hidden="true">/</kbd>
            </div>
            <p class="tool-count" id="tool-count" role="status" aria-live="polite"></p>
        </div>

        <div class="category-chips" id="category-chips" role="group" aria-label="Filter by category"></div>

        <div class="tools-grid" id="tools-grid">
            <noscript>
                <div class="empty-state">
                    <p>Enable JavaScript to search and filter the catalog, or run <code>dev-cli list</code> to see every tool in your terminal.</p>
                </div>
            </noscript>
        </div>

        <div class="empty-state" id="tools-empty" hidden>
            <span class="empty-icon" aria-hidden="true">🔍</span>
            <p>No tools match your search.</p>
            <button type="button" class="btn secondary small" id="clear-filters">Clear filters</button>
        </div>
    </section>

    <footer>
        <p>&copy; <span class="footer-year">2026</span> Dev-CLI. Built with ❤️ and <span class="rust-color">Rust</span>.</p>
    </footer>

    <script src="tools-data.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
